name: Instagram Reels Automation Core Pipeline 2026

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'trend_agent.py'
      - 'instagram_agent.py'
      - 'requirements.txt'
      - '.github/workflows/auto_scheduler.yml'
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: read

concurrency:
  group: instagram-reels-automation
  cancel-in-progress: false

jobs:
  run_agents:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile trend_agent.py instagram_agent.py

      - name: Run Trend Agent
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: 'true'
        run: python trend_agent.py

      - name: Run Instagram Agent
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          DRY_RUN: 'true'
        run: python instagram_agent.py
