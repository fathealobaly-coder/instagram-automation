
name: Auto Video Trend Scheduler

on:
  push:
    branches:
      - main
  schedule:
    # Three scheduled attempts per UTC day; GitHub may delay them.
    - cron: '17 */8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-video-trend-scheduler-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-trend-agent:
    name: Run trend agent
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || {
            echo "Missing secret: SUPABASE_URL"
            exit 1
          }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || {
            echo "Missing secret: SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          }

      - name: Run trend agent
        run: python trend_agent.py
