
name: Auto Video Trend Scheduler

on:
  push:
    branches:
      - main

  schedule:
    - cron: '17 */8 * * *'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-video-trend-scheduler-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-trend-agent:
    name: Run trend agent
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check agent and install dependencies
        shell: bash
        run: |
          set -e

          if [ ! -f "trend_agent.py" ]; then
            echo "ERROR: trend_agent.py is missing from repository root."
            exit 1
          fi

          python -m pip install --upgrade pip

          if [ -f "requirements.txt" ]; then
            echo "Found requirements.txt. Installing dependencies."
            python -m pip install -r requirements.txt
          else
            echo "WARNING: requirements.txt is missing."
            echo "Installing requests as the fallback dependency."
            python -m pip install "requests>=2.32.0,<3.0.0"
          fi

          python -m py_compile trend_agent.py
          echo "Pre-flight checks passed."

      - name: Validate required secrets
        shell: bash
        run: |
          set -e

          test -n "$SUPABASE_URL" || {
            echo "ERROR: Missing SUPABASE_URL secret."
            exit 1
          }

          test -n "$SUPABASE_SERVICE_ROLE_KEY" || {
            echo "ERROR: Missing SUPABASE_SERVICE_ROLE_KEY secret."
            exit 1
          }

          echo "Required secrets are present."

      - name: Run trend agent
        run: python trend_agent.py
