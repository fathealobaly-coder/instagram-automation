name: Master Assistant Orchestrator

on:
  schedule:
    - cron: '0 */6 * * *'  # يعمل آلياً كل 6 ساعات لمراقبة الوكيلين وإعطاء التقارير
  workflow_dispatch:      # يتيح لك تشغيله يدوياً في أي وقت تريد

jobs:
  run-master:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Initialize Python Runtime 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase

      - name: Execute Master Assistant Agent
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python master_agent.py
